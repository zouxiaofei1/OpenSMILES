<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline Debug — ChemAgent</title>
<link rel="stylesheet" href="/css/app.css">
<style>
  /* Debug-specific styles */
  .debug-page {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  .debug-input-bar {
    display: flex;
    gap: var(--space-md);
    padding: var(--space-lg) 0;
    border-bottom: 1px solid rgba(71, 85, 105, 0.3);
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--color-background);
  }

  .debug-input-bar .input {
    flex: 1;
    min-height: 40px;
    font-family: var(--mono);
    font-size: 13px;
  }

  .debug-body {
    flex: 1;
    overflow-y: auto;
    padding: var(--space-lg) 0;
  }

  /* Timeline-style layer list */
  .layer-list {
    display: flex;
    flex-direction: column;
    gap: var(--space-lg);
  }

  .layer-card {
    background: var(--color-surface-1);
    border: 1px solid rgba(71, 85, 105, 0.3);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: border-color var(--transition);
    position: relative;
  }

  .layer-card:hover {
    border-color: rgba(71, 85, 105, 0.5);
  }

  .layer-card.error {
    border-color: rgba(239, 68, 68, 0.4);
  }

  .layer-card.error::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--color-destructive);
  }

  .layer-head {
    display: flex;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-md) var(--space-xl);
    background: var(--color-surface-2);
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
    transition: all var(--transition-fast);
  }

  .layer-card.open > .layer-head {
    border-bottom-color: rgba(71, 85, 105, 0.25);
  }

  .layer-head:hover {
    background: var(--color-surface-3);
  }

  .layer-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    font-family: var(--mono);
    flex-shrink: 0;
  }

  .layer-icon.l0 { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
  .layer-icon.l1 { background: rgba(56, 189, 248, 0.12); color: #38bdf8; }
  .layer-icon.l2 { background: rgba(34, 197, 94, 0.12); color: #4ade80; }
  .layer-icon.l3 { background: rgba(245, 158, 11, 0.12); color: #fbbf24; }
  .layer-icon.l4 { background: rgba(236, 72, 153, 0.12); color: #f472b6; }
  .layer-icon.l5 { background: rgba(168, 85, 247, 0.12); color: #c084fc; }

  .layer-info {
    flex: 1;
    min-width: 0;
  }

  .layer-name {
    font-weight: 600;
    font-size: 14px;
    color: var(--color-foreground);
  }

  .layer-desc {
    font-size: 11px;
    color: var(--color-muted-text);
    margin-top: 2px;
  }

  .layer-meta {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    flex-shrink: 0;
  }

  .layer-time {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--color-muted-text);
  }

  .layer-chevron {
    width: 20px;
    height: 20px;
    color: var(--color-muted-text-dim);
    transition: transform var(--transition);
    flex-shrink: 0;
  }

  .layer-card.open .layer-chevron {
    transform: rotate(180deg);
  }

  .layer-content {
    display: none;
    padding: var(--space-lg) var(--space-xl);
    font-size: 13px;
  }

  .layer-card.open .layer-content {
    display: block;
  }

  /* JSON-like inline data */
  .debug-kv {
    margin: 0;
    display: grid;
    grid-template-columns: minmax(140px, auto) 1fr;
    gap: 4px var(--space-lg);
    align-items: start;
  }

  .debug-kv dt {
    font-size: 12px;
    color: var(--color-muted-text);
    font-weight: 500;
    white-space: nowrap;
  }

  .debug-kv dd {
    margin: 0;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--color-foreground-dim);
    word-break: break-all;
    line-height: 1.6;
  }

  .debug-kv dd.muted {
    color: var(--color-muted-text);
  }

  /* JSON viewer */
  .json-block {
    margin: var(--space-sm) 0;
    padding: var(--space-lg);
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--color-foreground-dim);
    max-height: 400px;
    overflow-y: auto;
  }

  .json-block.inline {
    max-height: none;
    font-size: 11px;
    padding: var(--space-sm) var(--space-md);
  }

  /* Sub-section */
  .debug-sub {
    margin-top: var(--space-md);
    border-top: 1px solid rgba(71, 85, 105, 0.2);
    padding-top: var(--space-md);
  }

  .debug-sub-title {
    font-weight: 600;
    font-size: 12px;
    color: var(--color-muted-text);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: var(--space-sm);
  }

  /* Substituents table */
  .subst-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .subst-table th {
    text-align: left;
    padding: 6px 10px;
    font-weight: 600;
    color: var(--color-muted-text);
    border-bottom: 1px solid var(--color-border);
    font-size: 11px;
    text-transform: uppercase;
  }

  .subst-table td {
    padding: 5px 10px;
    border-bottom: 1px solid rgba(71, 85, 105, 0.15);
    font-family: var(--mono);
    color: var(--color-foreground-dim);
  }

  /* Candidate cards */
  .candidate-card {
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    padding: var(--space-md) var(--space-lg);
    margin-bottom: var(--space-sm);
  }

  .candidate-card.selected {
    border-color: rgba(34, 197, 94, 0.35);
    background: rgba(34, 197, 94, 0.04);
  }

  .candidate-kind {
    font-weight: 600;
    font-size: 13px;
    color: var(--color-foreground);
  }

  .candidate-kind .sel-tag {
    font-size: 10px;
    font-weight: 700;
    color: #052e16;
    background: var(--color-accent);
    padding: 1px 7px;
    border-radius: 4px;
    margin-left: 8px;
  }

  /* Summary chips row */
  .summary-row {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-sm);
    margin-bottom: var(--space-md);
  }

  /* Empty / initial state */
  .debug-empty {
    text-align: center;
    padding: 64px 16px;
    color: var(--color-muted-text);
  }

  .debug-empty h2 {
    margin: 0 0 8px;
    font-size: 18px;
    color: var(--color-foreground-dim);
  }

  .debug-empty p {
    margin: 0;
    font-size: 13px;
  }

  /* Inline ring atom list */
  .atom-list {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--color-info-soft);
    word-break: break-all;
  }

  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .status-dot.ok { background: var(--color-accent); }
  .status-dot.fail { background: var(--color-destructive); }
</style>
</head>
<body>

<div class="app">
  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <a class="logo" href="/">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span class="logo-text">ChemAgent</span>
      </a>
      <nav class="topbar-nav">
        <a class="tab" href="/">Namer</a>
        <a class="tab" href="/preview/">Benchmarks</a>
        <a class="tab" aria-current="page" href="/debug.html">Pipeline Debug</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <div class="main">
    <div class="debug-page">
      <!-- Input -->
      <div class="debug-input-bar">
        <input id="smilesInput" class="input" type="text"
               placeholder="Enter SMILES, e.g. c1ccccc1C(=O)O or CC(=O)OC1CCCCC1"
               autofocus autocomplete="off" spellcheck="false">
        <button id="runBtn" class="btn btn-primary" onclick="runDebug()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <span>Run</span>
        </button>
        <button class="btn btn-secondary" onclick="loadExample('c1ccccc1C(=O)O')">
          Benzoic
        </button>
        <button class="btn btn-secondary" onclick="loadExample('c1ccc2c(c1)cccc2')">
          Naphthalene
        </button>
        <button class="btn btn-secondary" onclick="loadExample('Oc1ccc(Cl)cc1')">
          4-Chlorophenol
        </button>
      </div>

      <!-- Output -->
      <div id="output" class="debug-body">
        <div class="debug-empty">
          <h2>Pipeline Debug</h2>
          <p>Enter a SMILES above and click Run to trace the naming pipeline layer by layer.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '/api/v1/debug';

async function runDebug() {
  const smiles = document.getElementById('smilesInput').value.trim();
  if (!smiles) return;

  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="skeleton" style="width:60px;height:16px;display:inline-block;border-radius:4px;"></span>';

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ smiles }),
    });
    const data = await res.json();
    render(data);
  } catch (err) {
    document.getElementById('output').innerHTML =
      '<div class="debug-empty"><h2>Error</h2><p>' + escapeHtml(String(err)) + '</p></div>';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>Run</span>';
  }
}

function loadExample(smiles) {
  document.getElementById('smilesInput').value = smiles;
  runDebug();
}

function render(data) {
  const out = document.getElementById('output');
  if (!data.success) {
    out.innerHTML = '<div class="debug-empty"><h2>Error</h2><p>' + escapeHtml(data.error || 'Unknown error') + '</p></div>';
    return;
  }

  const layers = data.layers;
  const layerDefs = [
    { key: 'L0_preprocess',   icon: 'l0', name: 'Layer 0 — Preprocess',     desc: 'SMILES → Mol (RDKit sanitization, kekulization)' },
    { key: 'L1_analyze',      icon: 'l1', name: 'Layer 1 — Analyze',         desc: 'Mol → Info dict (FGs, ring systems, unsaturation)' },
    { key: 'L2_parent',       icon: 'l2', name: 'Layer 2 — Parent Select',   desc: 'Info → Parent candidates → Selected parent hydride' },
    { key: 'L3_substituents', icon: 'l3', name: 'Layer 3 — Substituents',    desc: 'Parent + Info → Substituent extraction + Coverage ledger' },
    { key: 'L4_numbering',    icon: 'l4', name: 'Layer 4 — Numbering',       desc: 'Parent + Substituents → Numbered dict (locants, chain orient)' },
    { key: 'L5_assemble',     icon: 'l5', name: 'Layer 5 — Assembly',        desc: 'Numbered dict → NameResult (en + zh + stereo)' },
  ];

  let html = '<div class="summary-row">';
  html += '<span class="chip info">Total: <b>' + data.total_time_ms + ' ms</b></span>';
  for (const ld of layerDefs) {
    const l = layers[ld.key];
    if (l) {
      html += '<span class="chip">' + ld.key.replace('_',' ').replace('_',' ') + ': <b>' + (l.time_ms || '?') + ' ms</b></span>';
    }
  }
  html += '</div>';

  html += '<div class="layer-list">';
  for (const ld of layerDefs) {
    const l = layers[ld.key];
    if (!l) continue;
    const hasError = !!l.error;
    // 默认 open: 分层始终展开，无需每次手动点开（仍可点标题临时收起）
    html += '<div class="layer-card open' + (hasError ? ' error' : '') + '" data-layer="' + ld.key + '">';
    html += '<div class="layer-head" onclick="toggleLayer(this)">';
    html += '<div class="layer-icon ' + ld.icon + '">' + ld.key[1] + '</div>';
    html += '<div class="layer-info"><div class="layer-name">' + ld.name + '</div>';
    html += '<div class="layer-desc">' + ld.desc + '</div></div>';
    html += '<div class="layer-meta">';
    if (hasError) {
      html += '<span class="badge fail">ERROR</span>';
    }
    html += '<span class="layer-time">' + (l.time_ms || '?') + ' ms</span>';
    html += '<svg class="layer-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';
    html += '</div></div>';
    html += '<div class="layer-content">' + renderLayer(ld.key, l) + '</div>';
    html += '</div>';
  }
  html += '</div>';

  out.innerHTML = html;
}

function toggleLayer(headEl) {
  headEl.parentElement.classList.toggle('open');
}

function renderLayer(key, l) {
  if (l.error) {
    return '<div style="color:var(--color-destructive-soft);font-family:var(--mono);">' + escapeHtml(l.error) + '</div>';
  }

  switch (key) {
    case 'L0_preprocess':
      return renderL0(l);
    case 'L1_analyze':
      return renderL1(l);
    case 'L2_parent':
      return renderL2(l);
    case 'L3_substituents':
      return renderL3(l);
    case 'L4_numbering':
      return renderL4(l);
    case 'L5_assemble':
      return renderL5(l);
    default:
      return '<pre class="json-block">' + JSON.stringify(l, null, 2) + '</pre>';
  }
}

function renderL0(l) {
  let html = '<dl class="debug-kv">' +
    '<dt>SMILES</dt><dd>' + escapeHtml(l.smiles || '') + '</dd>' +
    '<dt>Atoms</dt><dd>' + l.num_atoms + '</dd>' +
    '<dt>Bonds</dt><dd>' + l.num_bonds + '</dd>' +
    '<dt>Composition</dt><dd>' + escapeHtml(l.composition || '') + '</dd>';
  if (l.atoms || l.bonds) {
    html += '<dt>raw graph</dt><dd><details class="mol-details"><summary>show atoms / bonds</summary><pre class="json-block">' +
      escapeHtml(JSON.stringify({ smiles: l.smiles, atoms: l.atoms, bonds: l.bonds }, null, 2)) + '</pre></details></dd>';
  }
  html += '</dl>';
  return html;
}

function renderL1(l) {
  let html = '<dl class="debug-kv">';
  html += '<dt>n_carbons</dt><dd>' + l.n_carbons + '</dd>';
  html += '<dt>n_ring_systems</dt><dd>' + l.n_ring_systems + '</dd>';
  html += '<dt>n_rings</dt><dd>' + l.n_rings + '</dd>';
  html += '<dt>molecule</dt><dd>' + (l.mol ? (l.mol.num_atoms + ' atoms, ' + l.mol.num_bonds + ' bonds' +
    '<details class="mol-details"><summary>show raw Mol graph</summary><pre class="json-block">' +
    escapeHtml(JSON.stringify(l.mol, null, 2)) + '</pre></details>') : '—') + '</dd>';
  html += '</dl>';

  // Ring systems
  if (l.ring_systems && l.ring_systems.length) {
    html += '<div class="debug-sub"><div class="debug-sub-title">Ring Systems (' + l.ring_systems.length + ')</div>';
    for (let i = 0; i < l.ring_systems.length; i++) {
      const rs = l.ring_systems[i];
      const hets = (rs.hetero_atoms || []).map(h => 'idx=' + h.idx + '(Z=' + h.Z + ')').join(', ');
      html += '<div class="candidate-card">';
      html += '<span class="badge">' + rs.topology + '</span> ';
      html += '<span class="chip">' + rs.n_rings + ' rings</span> ';
      html += '<span class="chip">' + rs.n_atoms + ' atoms</span> ';
      if (hets) html += '<span class="chip info">hetero: ' + escapeHtml(hets) + '</span>';
      html += '<div style="margin-top:4px"><span class="atom-list">atoms=[' + (rs.atom_ids || []).slice(0,30).join(',') + (rs.atom_ids && rs.atom_ids.length > 30 ? '...' : '') + ']</span></div>';
      html += '</div>';
    }
    html += '</div>';
  }

  // Rings
  if (l.rings && l.rings.length) {
    html += '<div class="debug-sub"><div class="debug-sub-title">SSSR Rings (' + l.rings.length + ')</div>';
    html += '<table class="subst-table"><thead><tr><th>#</th><th>Size</th><th>Atoms</th></tr></thead><tbody>';
    for (let i = 0; i < l.rings.length; i++) {
      const r = l.rings[i];
      const ids = r.atom_ids || [];
      html += '<tr><td>' + i + '</td><td>' + ids.length + '-membered</td><td class="atom-list">[' + ids.join(',') + ']</td></tr>';
    }
    html += '</tbody></table></div>';
  }

  // Functional Groups: presence derived from every FG entry list (non-empty = present) + each list with its content
  html += '<div class="debug-sub"><div class="debug-sub-title">Functional Groups</div>';
  const fgMap = {
    carboxyls:'COOH', hydroxyls:'OH', aldehydes:'CHO', double_bonds:'C=C', triple_bonds:'C≡C',
    acyl_chlorides:'COCl', amides:'CON', amines:'NH2/NH', anhydrides:'(CO)2O', esters:'COOR',
    ketones:'C=O', nitriles:'C≡N', phosphates:'OPO3', thiols:'SH', acyls:'C(=O)-*',
    radicals:'*', demoted_carboxyls:'COOH↓', demoted_nitriles:'C≡N↓',
  };
  // FG entry lists (dynamic: any list key in the info dict that is not structural)
  const STRUCT_KEYS = new Set(['ring_systems', 'rings', 'carbon_ids', 'mol']);
  const fgListKeys = Object.keys(l).filter(k => Array.isArray(l[k]) && !STRUCT_KEYS.has(k));
  html += '<div class="summary-row">';
  for (const k of fgListKeys) {
    if (l[k].length) {
      html += '<span class="chip accent" title="' + escapeHtml(k) + '">' + escapeHtml(fgMap[k] || k) + '</span>';
    }
  }
  html += '</div>';
  const off = fgListKeys.filter(k => !l[k].length);
  if (off.length) {
    html += '<div class="fg-flags-off">' + off.map(k =>
      '<span class="fg-flag-off" title="' + escapeHtml(k) + '">' + escapeHtml(fgMap[k] || k) + '</span>'
    ).join('') + '</div>';
  }

  const entryKeys = fgListKeys.filter(k => l[k].length);
  if (entryKeys.length) {
    html += '<div class="fg-entries"><table class="subst-table"><thead><tr><th>FG</th><th>Count</th><th>Entries</th></tr></thead><tbody>';
    for (const k of entryKeys) {
      html += '<tr><td>' + escapeHtml(k) + '</td><td>' + l[k].length + '</td><td class="atom-list">' +
        escapeHtml(JSON.stringify(l[k])) + '</td></tr>';
    }
    html += '</tbody></table></div>';
  }

  // Raw info dict fallback: everything else (carbon_ids, fg_inventory, ...)
  html += '<details class="mol-details"><summary>show raw L1 info dict (' + Object.keys(l).length + ' keys)</summary>' +
    '<pre class="json-block">' + escapeHtml(JSON.stringify(l, null, 2)) + '</pre></details>';

  return html;
}

function renderL2(l) {
  let html = '<dl class="debug-kv">';
  html += '<dt>n_candidates</dt><dd>' + l.n_candidates + '</dd>';
  html += '<dt>selected kind</dt><dd style="color:var(--color-accent-soft);font-weight:600;">' + escapeHtml(l.selected?.kind || '—') + '</dd>';
  html += '</dl>';

  if (l.candidates && l.candidates.length) {
    html += '<div class="debug-sub"><div class="debug-sub-title">All Candidates</div>';
    for (const c of l.candidates) {
      const sel = c.is_selected;
      html += '<div class="candidate-card' + (sel ? ' selected' : '') + '">';
      html += '<div class="candidate-kind">' + escapeHtml(c.kind || '?');
      if (sel) html += '<span class="sel-tag">SELECTED</span>';
      html += '</div>';
      html += '<pre class="json-block inline">' + JSON.stringify(c, null, 2) + '</pre>';
      html += '</div>';
    }
    html += '</div>';
  }

  return html;
}

function renderL3(l) {
  let html = '<dl class="debug-kv">';
  html += '<dt>substituents</dt><dd>' + l.n_substituents + '</dd>';
  html += '<dt>coverage complete</dt><dd><span class="status-dot ' + (l.coverage?.complete ? 'ok' : 'fail') + '"></span>' + (l.coverage?.complete ? 'YES' : 'NO') + '</dd>';
  if (l.coverage?.gap?.length) {
    html += '<dt>gap atoms</dt><dd class="atom-list">[' + l.coverage.gap.join(',') + ']</dd>';
  }
  if (l.coverage?.overlap?.length) {
    html += '<dt>overlap atoms</dt><dd class="atom-list">[' + l.coverage.overlap.join(',') + ']</dd>';
  }
  html += '<dt>owned atoms</dt><dd class="atom-list">[' + (l.owned_atoms||[]).slice(0,40).join(',') + ((l.owned_atoms||[]).length > 40 ? '...' : '') + ']</dd>';
  html += '</dl>';

  if (l.substituents && l.substituents.length) {
    html += '<div class="debug-sub"><div class="debug-sub-title">Substituent List</div>';
    html += '<table class="subst-table"><thead><tr><th>#</th><th>EN</th><th>ZH</th><th>Kind</th><th>Attach</th><th>Paren</th><th>Atoms</th></tr></thead><tbody>';
    for (let i = 0; i < l.substituents.length; i++) {
      const s = l.substituents[i];
      html += '<tr>' +
        '<td>' + i + '</td>' +
        '<td style="font-weight:500;">' + escapeHtml(s.en || '?') + '</td>' +
        '<td>' + escapeHtml(s.zh || '') + '</td>' +
        '<td>' + escapeHtml(s.kind || '') + '</td>' +
        '<td>' + (s.attach_idx !== undefined ? s.attach_idx : '—') + '</td>' +
        '<td>' + (s.paren ? 'yes' : '') + '</td>' +
        '<td class="atom-list">[' + (s.atoms||[]).join(',') + ']</td>' +
        '</tr>';
    }
    html += '</tbody></table></div>';
  }

  return html;
}

function renderL4(l) {
  let html = '<dl class="debug-kv">';
  html += '<dt>parent kind</dt><dd style="color:var(--color-accent-soft);font-weight:600;">' + escapeHtml(l.parent_kind || '—') + '</dd>';
  html += '<dt>chain</dt><dd class="atom-list">[' + (l.chain||[]).join(',') + ']</dd>';
  html += '</dl>';

  if (l.locants && Object.keys(l.locants).length) {
    html += '<div class="debug-sub"><div class="debug-sub-title">Locants</div>';
    html += '<dl class="debug-kv">';
    for (const [k, v] of Object.entries(l.locants)) {
      html += '<dt>' + escapeHtml(k) + '</dt><dd>' + escapeHtml(String(v)) + '</dd>';
    }
    html += '</dl></div>';
  }

  if (l.substituents && l.substituents.length) {
    html += '<div class="debug-sub"><div class="debug-sub-title">Numbered Substituents (' + l.substituents.length + ')</div>';
    html += '<table class="subst-table"><thead><tr><th>#</th><th>EN</th><th>Locant</th><th>Kind</th></tr></thead><tbody>';
    for (let i = 0; i < l.substituents.length; i++) {
      const s = l.substituents[i];
      html += '<tr>' +
        '<td>' + i + '</td>' +
        '<td style="font-weight:500;">' + escapeHtml(s.en || '?') + '</td>' +
        '<td>' + (s.locant !== undefined ? s.locant : '—') + '</td>' +
        '<td>' + escapeHtml(s.kind || '') + '</td>' +
        '</tr>';
    }
    html += '</tbody></table></div>';
  }

  if (Object.keys(l).filter(k => !['parent_kind','chain','locants','substituents','time_ms'].includes(k)).length) {
    html += '<pre class="json-block">' + JSON.stringify(l, null, 2) + '</pre>';
  }
  return html;
}

function renderL5(l) {
  let html = '';
  if (l.en || l.zh) {
    html += '<div style="display:flex;flex-direction:column;gap:var(--space-md);">';

    html += '<div style="background:var(--color-surface-2);border:1px solid rgba(34,197,94,0.3);border-radius:var(--radius);padding:var(--space-lg);">';
    html += '<div class="field-label">English Name</div>';
    html += '<div style="font-family:var(--mono);font-size:15px;font-weight:500;color:var(--color-foreground);word-break:break-all;">' + escapeHtml(l.en) + '</div>';
    html += '</div>';

    html += '<div style="background:var(--color-surface-2);border:1px solid rgba(56,189,248,0.3);border-radius:var(--radius);padding:var(--space-lg);">';
    html += '<div class="field-label">Chinese Name</div>';
    html += '<div style="font-family:var(--mono);font-size:15px;font-weight:500;color:var(--color-foreground);word-break:break-all;">' + escapeHtml(l.zh) + '</div>';
    html += '</div>';

    html += '<dl class="debug-kv">';
    html += '<dt>success</dt><dd>' + l.success + '</dd>';
    html += '<dt>source</dt><dd>' + escapeHtml(l.source || '') + '</dd>';
    html += '</dl>';

    html += '</div>';
  }
  if (l.meta && Object.keys(l.meta).length) {
    html += '<div class="debug-sub"><div class="debug-sub-title">Meta</div>';
    html += '<pre class="json-block inline">' + JSON.stringify(l.meta, null, 2) + '</pre></div>';
  }
  return html || '<span class="muted-text">(no output)</span>';
}

function escapeHtml(s) {
  const el = document.createElement('span');
  el.textContent = String(s);
  return el.innerHTML;
}

// Enter key triggers run
document.getElementById('smilesInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') runDebug();
});
</script>
